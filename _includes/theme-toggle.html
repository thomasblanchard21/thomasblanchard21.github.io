{% comment %}
    Light/dark theme switch (see _sass/theme.scss and assets/js/theme.js).
    Hidden until the script runs, since it does nothing without JS.
{% endcomment %}
<button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" hidden>
    <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/>
    </svg>
    <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
    </svg>
</button>
